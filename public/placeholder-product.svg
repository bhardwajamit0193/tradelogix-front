<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="16" />
  <rect x="1" y="1" width="398" height="398" stroke="#cbd5e1" stroke-width="2" rx="15" fill="none" />

  <!-- Subtle Blueprint Grid -->
  <path d="M 0,100 L 400,100 M 0,200 L 400,200 M 0,300 L 400,300 M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.25" />

  <!-- Central Packaging Isometric Box / Industrial Icon -->
  <g transform="translate(140, 130)">
    <!-- Top Face -->
    <path d="M 60,0 L 120,30 L 60,60 L 0,30 Z" fill="#94a3b8" opacity="0.6" />
    <!-- Left Face -->
    <path d="M 0,30 L 60,60 L 60,130 L 0,100 Z" fill="url(#boxGrad)" />
    <!-- Right Face -->
    <path d="M 60,60 L 120,30 L 120,100 L 60,130 Z" fill="#64748b" opacity="0.75" />
    <!-- Top Flap Tape Accent -->
    <path d="M 45,7.5 L 75,22.5 L 75,52.5 L 45,37.5 Z" fill="url(#accentGrad)" opacity="0.85" />
  </g>

  <!-- Brand Watermark / Text Label -->
  <text x="200" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.05em">
    TRADELOGIX
  </text>
  <text x="200" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
    Industrial Hardware Catalog
  </text>
</svg>
